<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0B132B">
  <meta name="description" content="قائمة المفضلة في متجر TechGadget — أجهزته التي حفظتها للرجوع إليها وطلبها لاحقاً.">
  <title>المفضلة | TechGadget</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230EA5E9'/%3E%3Crect x='30' y='18' width='40' height='64' rx='10' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page-title="المفضلة">

  <a class="skip-link" href="#mainContent">تخطّي إلى المحتوى</a>

  <header class="navbar" aria-label="الشريط العلوي"></header>

  <main class="main" id="mainContent">
    <div class="container">
      <div class="section__head" style="margin-top:clamp(18px,3vw,32px)">
        <div>
          <h1 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span aria-hidden="true">❤️</span>
            قائمة المفضلة
            <span class="badge" id="favoritesCount">0</span>
          </h1>
          <p class="section__sub">الأجهزة التي حفظتها تبقى هنا حتى تقرر الطلب. يمكنك إزالتها في أي وقت.</p>
        </div>
        <div class="hero__actions" id="favoritesActions"></div>
      </div>

      <div id="favoritesGrid" class="products" aria-live="polite"></div>

      <section class="section" aria-labelledby="discoverTitle">
        <h2 id="discoverTitle" style="font-size:1.05rem;margin-bottom:12px">تحتاج أفكاراً؟</h2>
        <div class="hero__actions">
          <a class="btn btn--primary btn--sm" href="index.html#new-devices">تصفّح الأجهزة الجديدة</a>
          <a class="btn btn--ghost btn--sm" href="index.html#used-devices">الأجهزة المستعملة</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__bottom">
      <div class="container">
        <p>© <span id="year">2026</span> TechGadget — جميع الحقوق محفوظة.</p>
      </div>
    </div>
  </footer>

  <script src="js/core.js?v=3" defer></script>
  <script src="js/favorites.js?v=2" defer></script>
</body>
</html>
